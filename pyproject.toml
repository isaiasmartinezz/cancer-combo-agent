[project]
name = "cancer-combo-agent"
version = "0.1.0"
description = "Literature-informed experiment selection for cancer drug combinations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "network: test needs the internet (never part of make check)",
    "data: test reads the built dataset; skipped if it has not been built",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
